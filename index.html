<style>
/* Layout: one narrow time-card column, stamp slots for in/out, bottom tab bar on every width */
:root {
  --bg: #0E0F1A;
  --surface: #181A2B;
  --sunk: #0E0F1A;
  --raise: #1E2035;
  --ink: #F2F3FF;
  --muted: #A3A7C7;
  --line: #2C2F4A;
  --accent: #FF7B94;
  --accent-ink: #1A0A10;
  --warn: #FFC23D;
  --warn-bg: #2E2715;
  --bad: #FF8A8A;
  --t-office: #3DE0FF;
  --t-home: #C6FF3D;
  --t-vacation: #6FA8FF;
  --t-sick: #FFC23D;
  --t-holiday: #B794FF;
  --t-rest: #5A5E80;
  --font-body: "Heebo", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --font-num: "Heebo", "Segoe UI", Arial, sans-serif;
  --r: 22px;
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { direction: rtl; max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.head h1 { font-size: 22px; font-weight: 700; }
.head .sub { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }

/* banners */
.banner { border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; border: 1px solid; }
.banner.hol { background: color-mix(in srgb, var(--t-holiday) 12%, var(--surface)); border-color: color-mix(in srgb, var(--t-holiday) 40%, var(--line)); }
.banner.info { background: var(--sunk); border-color: var(--line); }
.banner.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.banner b { font-weight: 600; }

/* day-type segmented control */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 9px 4px; cursor: pointer; font-weight: 500; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--tc) 16%, var(--surface)); border-color: var(--tc); color: var(--ink); font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tc); flex: none; }

/* time card */
.stamps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stamp { border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; background: var(--sunk); }
.stamp.filled { border-style: solid; border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); background: var(--surface); }
.stamp .t { font-size: 30px; font-weight: 600; line-height: 1.15; text-align: right; }
.stamp .t.empty { color: var(--muted); opacity: .55; }
.punch { width: 100%; border: 0; border-radius: 14px; padding: 18px; font-size: 20px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; gap: 10px; }
.punch.out { background: var(--ink); color: var(--surface); }
.punch:active { transform: translateY(1px); }
.total { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.total .big { font-size: 22px; font-weight: 600; }

/* fields */
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 500; color: var(--muted); }
input[type="text"], input[type="number"], input[type="time"], input[type="date"], input[type="month"], select, textarea {
  width: 100%; min-width: 0; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 44px; }
input[type="time"], input[type="date"], input[type="month"] { display: block; -webkit-appearance: none; appearance: none; text-align: right; padding-inline: 8px; }
body.locked { overflow: hidden; }
textarea { min-height: 64px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.money { position: relative; }
.money input { padding-left: 34px; direction: ltr; text-align: right; font-family: var(--font-num); }
.money::after { content: "₪"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.hint { font-size: 13px; color: var(--muted); }
.hint.warn, .hint .warn { color: var(--warn); }
.hint.bad, .hint .bad { color: var(--bad); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 500; min-height: 42px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.link { border: 0; background: none; padding: 4px 0; min-height: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

/* month stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--sunk); border-radius: 10px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.stat .v { font-size: 18px; font-weight: 600; text-align: right; }
.stat .k { font-size: 12px; color: var(--muted); }

/* calendar */
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.monthnav h2 { font-size: 18px; }
.iconbtn { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 18px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 2px; font-weight: 500; }
.day { position: relative; aspect-ratio: 1 / 1.08; max-width: 100%; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; padding: 4px; display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; text-align: right; min-width: 0; overflow: hidden; }
.day .n { font-family: var(--font-num); font-size: 13px; font-weight: 600; }
.day .h { font-family: var(--font-num); font-size: 10.5px; color: var(--muted); direction: ltr; text-align: left; margin-top: auto; }
.day .h:empty { display: none; }
.day .hn { font-size: 9.5px; line-height: 1.1; font-weight: 600; color: var(--t-holiday); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; margin-top: auto; }
.day .hn + .h { margin-top: 1px; }
.day .hn.info { color: var(--muted); font-weight: 500; }
@media (min-width: 520px) { .day .hn { font-size: 11px; } }
.holist { display: grid; gap: 4px; font-size: 14px; }
.holist div { display: flex; gap: 10px; align-items: baseline; }
.holist .num { color: var(--muted); font-size: 13px; min-width: 40px; }
.holist .info { color: var(--muted); }
.day.typed { background: color-mix(in srgb, var(--tc) 15%, var(--surface)); border-color: color-mix(in srgb, var(--tc) 45%, var(--line)); }
.day.rest { background: var(--sunk); color: var(--muted); }
.day.missing { border-style: dashed; }
.day.alert { box-shadow: inset 0 0 0 2px var(--warn); }
.day.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.day .star { position: absolute; top: 4px; left: 5px; color: var(--t-holiday); font-size: 11px; line-height: 1; }
.day.blank { visibility: hidden; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* list of days in month */
.dlist { display: grid; gap: 0; }
.ditem { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-inline: 0; border-top: 0; text-align: right; width: 100%; }
.ditem:last-child { border-bottom: 0; }
.ditem .d { font-weight: 600; }
.ditem .d small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: color-mix(in srgb, var(--tc) 15%, var(--surface)); color: var(--ink); }

/* table */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl td { padding: 7px 2px; border-bottom: 1px solid var(--line); }
.tbl td:last-child { text-align: left; }
.tbl tr:last-child td { border-bottom: 0; }

/* sheet (edit day) */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 13, .45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { direction: rtl; background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.sheet h3 { font-size: 18px; }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 18px; } }
.confirm { border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); background: color-mix(in srgb, var(--bad) 7%, var(--surface)); border-radius: 10px; padding: 12px; display: grid; gap: 10px; font-size: 14px; }

/* tab bar */
.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .in { direction: rtl; max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs button { border: 0; background: none; border-radius: 10px; padding: 6px 4px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); font-weight: 600; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 35; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); direction: rtl; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.wd { display: flex; flex-wrap: wrap; gap: 6px; }
.wd label { border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 14px; }
.wd input { accent-color: var(--accent); }
@media (max-width: 380px) { .stamp .t { font-size: 25px; } .seg button { font-size: 13px; } .stats { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- Night Neon theme ---------- */
.app { gap: 14px; padding-top: 18px; }
.head { align-items: flex-end; }
.head h1 { font-size: 28px; font-weight: 800; letter-spacing: -.2px; }
.head .sub { font-size: 13px; }
.head .stack { display: grid; gap: 0; }
.typechip { font-size: 12px; font-weight: 700; color: var(--bg); background: var(--tc); border-radius: 99px; padding: 5px 12px; }
.card { border: 0; border-radius: var(--r); padding: 18px; }
.label { letter-spacing: 0; font-size: 13px; font-weight: 700; color: var(--ink); }
.banner { border-radius: 18px; }
.banner.info { background: var(--surface); border-color: var(--line); }
.banner.hol { background: color-mix(in srgb, var(--t-holiday) 14%, var(--surface)); }
.btn { background: var(--raise); border-color: var(--line); border-radius: 14px; }
.btn.primary { color: var(--accent-ink); font-weight: 800; }
.iconbtn { background: var(--raise); border-color: var(--line); border-radius: 14px; }

.seg { gap: 8px; }
.seg button { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; color: var(--tc); min-height: 44px; }
.seg button .dot { display: none; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--tc) 18%, var(--bg)); border-color: var(--tc); color: var(--tc); font-weight: 800; }

.ringwrap { position: relative; width: 210px; height: 210px; margin: 0 auto; }
.ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ringwrap .bgc { stroke: #262941; }
.ringwrap .fgc { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ringc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; }
.ringc .k { font-size: 13px; color: var(--muted); }
.ringc .big { font-size: 54px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
.ringc .left { font-size: 12px; font-weight: 700; color: var(--accent); }
.ringc .left.done { color: var(--t-home); }
.stamp { background: var(--sunk); border: 0; border-radius: 16px; padding: 10px 14px; }
.stamp.filled { background: var(--sunk); border: 0; }
.stamp .label { font-weight: 400; color: var(--muted); font-size: 12px; }
.stamp .t { font-size: 26px; font-weight: 700; color: var(--t-office); }
.stamp .t.empty { color: #5A5E80; opacity: 1; }
.punch { border-radius: 18px; font-weight: 800; background: var(--t-office); color: #04202A; min-height: 58px; padding: 16px; }
.punch.out { background: var(--accent); color: var(--accent-ink); }

input[type="text"], input[type="number"], input[type="time"], input[type="date"], input[type="month"], select, textarea { background: var(--sunk); border: 1.5px solid var(--line); border-radius: 12px; }
.money::after { color: var(--muted); }

.stats { gap: 8px; }
.stat { background: var(--sunk); border-radius: 16px; padding: 12px; }
.card > .stats .stat, .stats .stat { background: var(--sunk); }
.stat .v { font-size: 20px; font-weight: 800; }
.stats .stat:nth-child(6n+1) .v { color: var(--t-office); }
.stats .stat:nth-child(6n+2) .v { color: #FF7BC0; }
.stats .stat:nth-child(6n+3) .v { color: var(--t-sick); }
.stats .stat:nth-child(6n+4) .v { color: var(--t-home); }
.stats .stat:nth-child(6n+5) .v { color: var(--t-vacation); }
.stats .stat:nth-child(6n+6) .v { color: var(--t-holiday); }

.day { background: var(--sunk); border-color: var(--line); border-radius: 12px; }
.day.typed { background: var(--sunk); border-color: var(--line); box-shadow: inset 0 -4px 0 var(--tc); }
.day.rest { background: #12131F; border-color: #1F2133; color: #8287AD; }
.day.alert { box-shadow: inset 0 0 0 2px var(--warn); }
.day.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.day .h { color: var(--muted); }
.ditem { border-color: var(--line); }
.tbl td { border-color: var(--line); }
.pill { background: color-mix(in srgb, var(--tc) 20%, var(--bg)); color: var(--tc); }

.scrim { background: rgba(4, 5, 12, .66); }
.sheet { background: var(--surface); border-top: 1px solid var(--line); }
.confirm { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }

.tabs { left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--raise); border: 1px solid var(--line); border-radius: 24px; padding: 6px; max-width: 560px; margin: 0 auto; }
.tabs .in { gap: 4px; }
.tabs button { border-radius: 18px; padding: 7px 2px; min-height: 52px; font-size: 12px; }
.tabs button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 800; }
.toast { background: var(--ink); color: var(--bg); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.app { padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px)); }
/* 16px minimum on every field: iOS Safari zooms the page when a focused field is smaller and does not zoom back */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
input, select, textarea { font-size: 16px !important; }
button, input, select, textarea, label { touch-action: manipulation; }
/* month arrows: drawn, so RTL text mirroring cannot flip them */
.monthnav .iconbtn { width: 48px; height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--ink); }
.monthnav .iconbtn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
</style>

<script>
(function () {
"use strict";
document.documentElement.setAttribute("dir", "rtl");
document.documentElement.setAttribute("lang", "he");

/* ---------- constants ---------- */
var KEY = "attendance.v1";
var TYPES = {
  office:   { label: "משרד",  xl: "משרד",  c: "--t-office" },
  home:     { label: "בית",   xl: "בית",   c: "--t-home" },
  vacation: { label: "חופשה", xl: "חופשה", c: "--t-vacation" },

    (sm.unreported ? '<span class="hint">' + sm.unreported + " ימי עבודה ללא דיווח יסומנו \"לא דווח\".</span>" : "") +
    '<div class="row"><button class="btn primary" type="button" id="x-go">ייצוא לאקסל</button>' + (canShareFiles() ? '<button class="btn" type="button" id="x-share">שיתוף הקובץ</button>' : "") + "</div>" +
    (done ? '<span class="hint">יוצא לאחרונה: ' + esc(new Date(done).toLocaleString("he-IL")) + "</span>" : "") +
    '<span class="hint">שם הקובץ: ' + esc(xlsxName(exportYm)) + "</span></section>";
  var lb = S.meta.lastBackup;
  html += '<section class="card" aria-labelledby="b-h"><span class="label" id="b-h">גיבוי ושחזור</span>' +
    '<p class="muted" style="margin:0">קובץ הגיבוי מכיל את כל הימים וההגדרות. שמרו אותו בענן או במייל, ושחזרו ממנו אם הנתונים נמחקו או במעבר למכשיר חדש.</p>' +
    '<div class="row"><button class="btn primary" type="button" id="b-go">הורדת גיבוי</button><button class="btn" type="button" id="b-pick">שחזור מגיבוי</button><input type="file" id="b-file" class="vh" tabindex="-1" aria-hidden="true"></div>' +
    '<span class="hint">' + (lb ? "גיבוי אחרון: " + esc(new Date(lb).toLocaleString("he-IL")) : "עוד לא בוצע גיבוי") + " · " + Object.keys(S.days).length + " ימים שמורים</span>" +
    (pendingRestore ? '<div class="confirm" role="alert"><span>לשחזר מהקובץ <b>' + esc(pendingRestore.file) + "</b>? " + Object.keys(pendingRestore.data.days).length + " ימים. הנתונים הנוכחיים יוחלפו.</span>" +
      '<div class="row"><button class="btn primary" type="button" id="b-confirm">שחזור</button><button class="btn" type="button" id="b-cancel">ביטול</button></div></div>' : "") +
    "</section>";
  return html;
}
function trow(k, v) { return "<tr><td>" + esc(k) + '</td><td class="num">' + esc(v) + "</td></tr>"; }

function viewSettings() {
  var s = S.settings;
  return '<header class="head"><h1>הגדרות</h1></header>' +
    '<section class="card"><label class="field"><span>שם העובד (מופיע בקובץ)</span><input type="text" id="s-name" value="' + esc(s.name) + '" maxlength="60"></label>' +
    '<div class="field"><span>ימי עבודה</span><div class="wd">' + DAYS.map(function (d, i) {
      return '<label><input type="checkbox" data-wd="' + i + '" id="wd-' + i + '"' + (s.workDays.indexOf(i) !== -1 ? " checked" : "") + ">" + d + "</label>"; }).join("") + "</div></div>" +
    '<div class="grid2"><label class="field"><span>שעות תקן ליום</span><input type="number" id="s-std" min="1" max="24" step="0.5" value="' + s.stdHours + '"></label>' +
    '<label class="field"><span>תקרת סבסוד ארוחה</span><span class="money"><input type="number" id="s-cap" min="0" max="' + LUNCH_MAX + '" step="1" value="' + s.lunchCap + '"></span></label></div>' +
    '<div class="row"><button class="btn primary" type="button" id="s-save">שמירת הגדרות</button></div></section>' +
    '<section class="card"><span class="label">על האפליקציה</span><p class="muted" style="margin:0">הנתונים נשמרים רק במכשיר הזה, ללא שרת וללא מיקום. חגי ישראל מחושבים אוטומטית לפי הלוח העברי. כדי לא לאבד נתונים, הורידו גיבוי מדי שבוע ממסך הייצוא.</p></section>';
}

/* ---------- edit sheet ---------- */
var editIso = null, editConfirm = null, editInitial = null;
function openEdit(iso) { editIso = iso; editConfirm = null; renderSheet(); editInitial = JSON.stringify(readEdit()); }
function closeEdit() { editIso = null; editInitial = null; $("#sheet-root").innerHTML = ""; document.body.classList.remove("locked"); }
function editDirty() { return !!(editIso && $("#e-type") && editInitial !== JSON.stringify(readEdit())); }
function requestClose() {
  if (!editDirty()) { closeEdit(); return; }
  var keep = readEdit();
  editConfirm = { text: "יש שינויים שלא נשמרו. לסגור בלי לשמור?", yes: "סגירה בלי שמירה", act: "discard" };
  renderSheet(); restoreEdit(keep);
}
function renderSheet() {
  if (!editIso) return;
  var x = info(editIso), r = x.r || {}, type = x.type === "rest" ? "" : (x.type || "");
  var opts = [["", x.work ? "לא דווח" : "מנוחה"], ["office", "משרד"], ["home", "עבודה מהבית"], ["vacation", "חופשה"], ["sick", "מחלה"], ["holiday", "חג"]];
  var html = '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="e-h">' +
    '<div class="row spread"><h3 id="e-h">' + esc(longDate(editIso)) + '</h3><button class="iconbtn" type="button" id="e-close" aria-label="סגירה">✕</button></div>' +
    (x.hol ? '<span class="pill" style="--tc:var(--t-holiday)"><span class="dot"></span>' + esc(x.hol.name) + (x.hol.kind === "holiday" ? " · שבתון" : "") + "</span>" : "") +
    '<label class="field"><span>סוג יום</span><select id="e-type">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === type ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></label>" +
    '<div class="grid2"><label class="field"><span>כניסה</span><input type="time" id="e-in" value="' + (r.in || "") + '"></label><label class="field"><span>יציאה</span><input type="time" id="e-out" value="' + (r.out || "") + '"></label></div>' +
    '<label class="check"><input type="checkbox" id="e-night"' + (r.overnight ? " checked" : "") + '>משמרת שחוצה חצות</label>' +
    '<div class="grid2"><label class="field"><span>ארוחת צהריים</span><span class="money"><input type="number" inputmode="decimal" step="0.01" min="0" max="' + LUNCH_MAX + '" id="e-lunch" value="' + (typeof r.lunch === "number" ? r.lunch : "") + '"></span></label>' +
    '<label class="field"><span>הערה לארוחה</span><input type="text" id="e-lnote" maxlength="100" value="' + esc(r.lunchNote || "") + '"></label></div>' +
    '<label class="field"><span>הערה ליום</span><input type="text" id="e-note" maxlength="140" value="' + esc(r.note || "") + '"></label>' +
    '<span class="hint" id="e-msg" aria-live="polite"></span>' +
    (editConfirm ? '<div class="confirm" role="alert"><span>' + esc(editConfirm.text) + '</span><div class="row"><button class="btn primary" type="button" id="e-yes">' + esc(editConfirm.yes) + '</button><button class="btn" type="button" id="e-no">ביטול</button></div></div>' : "") +
    '<div class="row spread"><button class="btn danger" type="button" id="e-clear">ניקוי היום</button><button class="btn primary" type="button" id="e-save">שמירה</button></div>' +
    "</div></div>";
  $("#sheet-root").innerHTML = html;
  document.body.classList.add("locked");
  syncEditFields();
}
function syncEditFields() {
  var tp = $("#e-type"); if (!tp) return;
  var locked = tp.value === "vacation" || tp.value === "sick" || tp.value === "holiday";
  ["#e-in", "#e-out", "#e-lunch", "#e-lnote", "#e-night"].forEach(function (s) { $(s).disabled = locked; });
}
function readEdit() {
  return { type: $("#e-type").value, in: $("#e-in").value, out: $("#e-out").value, overnight: $("#e-night").checked,
           lunch: $("#e-lunch").value, lunchNote: $("#e-lnote").value.trim(), note: $("#e-note").value.trim() };
}
function validateEdit(v, force) {
  var msg = $("#e-msg");
  var locked = v.type === "vacation" || v.type === "sick" || v.type === "holiday";
  if (locked) return { ok: true };
  if (v.out && !v.in) return err("הזינו שעת כניסה לפני שעת יציאה.");
  if (v.in && v.out && hmToMin(v.out) <= hmToMin(v.in) && !v.overnight) return err("שעת היציאה מוקדמת משעת הכניסה. סמנו \"משמרת שחוצה חצות\" אם זה נכון.");
  if (v.lunch !== "") { var n = Number(v.lunch); if (isNaN(n) || n < 0 || n > LUNCH_MAX) return err("סכום הארוחה צריך להיות בין 0 ל-" + LUNCH_MAX + " ₪."); }
  if (v.in && v.out) { var m = hmToMin(v.out) - hmToMin(v.in); if (m < 0) m += 1440; if (m > 16 * 60 && !force) return { ok: false, confirm: { text: "יום של " + fmtMin(m) + " שעות. לשמור בכל זאת?", yes: "שמירה" } }; }
  return { ok: true };
  function err(t) { msg.className = "hint bad"; msg.textContent = t; return { ok: false }; }
}
function saveEdit(force) {
  var v = readEdit(), x = info(editIso), r = x.r || {};
  var locked = v.type === "vacation" || v.type === "sick" || v.type === "holiday";
  if (locked && (r.in || r.out || typeof r.lunch === "number") && !force) {
    editConfirm = { text: "מעבר ל" + TYPES[v.type].label + " ימחק את השעות וסכום הארוחה של היום.", yes: "המשך", act: "save" };
    var keep = v; renderSheet(); restoreEdit(keep); return;
  }
  var res = validateEdit(v, force);
  if (!res.ok) { if (res.confirm) { editConfirm = Object.assign(res.confirm, { act: "save" }); var k = v; renderSheet(); restoreEdit(k); } return; }
  var patch = locked ? { type: v.type, in: "", out: "", overnight: false, lunch: "", lunchNote: "", note: v.note }
    : { type: v.type || (v.in ? "office" : ""), in: v.in, out: v.out, overnight: v.overnight && !!v.in && !!v.out, lunch: v.lunch === "" ? "" : Math.round(Number(v.lunch) * 100) / 100, lunchNote: v.lunchNote, note: v.note };
  setRec(editIso, patch);
  closeEdit(); render(); toast("נשמר");
}
function restoreEdit(v) {
  $("#e-type").value = v.type; $("#e-in").value = v.in; $("#e-out").value = v.out; $("#e-night").checked = v.overnight;
  $("#e-lunch").value = v.lunch; $("#e-lnote").value = v.lunchNote; $("#e-note").value = v.note; syncEditFields();
}

/* ---------- actions ---------- */
function setTodayType(type) {
  var t = todayIso(), x = info(t), r = x.r || {};
  if ((type === "vacation" || type === "sick") && (r.in || r.out || typeof r.lunch === "number")) { openEdit(t); $("#e-type").value = type; syncEditFields(); saveEdit(false); return; }
  setRec(t, { type: type });
  render();
}
function punch(which) {
  var t = todayIso(), x = info(t), r = x.r || {}, now = nowHM();
  if (which === "out-prev") {
    var p = openPrevShift();
    if (!p) { render(); return; }
    setRec(p, { out: now, overnight: true });
    var mp = minutesOf(rec(p));
    render();
    toast("נרשמה יציאה ב-" + now + " למשמרת של " + shortDate(p) + (mp != null && mp > 16 * 60 ? ". יום ארוך מ-16 שעות, כדאי לבדוק את שעת הכניסה." : ""));
    return;
  }
  if (which === "in") setRec(t, { type: x.type === "home" ? "home" : "office", in: now });
  else {
    var overnight = hmToMin(now) < hmToMin(r.in);
    setRec(t, { out: now, overnight: overnight });
    var m = minutesOf(rec(t));
    render();
    toast("נרשמה יציאה ב-" + now + (m != null && m > 16 * 60 ? ". יום ארוך מ-16 שעות, כדאי לבדוק את שעת הכניסה." : ""));
    return;
  }
  render(); toast("נרשמה כניסה ב-" + now);
}
function saveLunch() {
  var v = $("#lunch-today").value, note = $("#lunchnote-today").value.trim();
  try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {}
  if (v !== "") { var n = Number(v); if (isNaN(n) || n < 0 || n > LUNCH_MAX) { $("#lunch-hint").innerHTML = lunchHint(v); return; } }
  var t = todayIso(), x = info(t);
  setRec(t, { type: x.type && x.type !== "rest" ? x.type : "office", lunch: v === "" ? "" : Math.round(Number(v) * 100) / 100, lunchNote: note });
  render(); toast(v === "" ? "הסכום נמחק" : "נשמר: " + fmtMoney(Number(v)));
}
function applyRange() {
  var a = $("#r-from").value, b = $("#r-to").value, type = $("#r-type").value;
  if (!a || !b) { toast("בחרו תאריך התחלה וסיום."); return; }
  if (b < a) { var tmp = a; a = b; b = tmp; }
  var n = 0, iso = a, guard = 0;
  while (iso <= b && guard++ < 400) {
    var x = info(iso);
    if (x.work && !(x.hol && x.hol.kind === "holiday")) {
      if (type === "home") setRec(iso, { type: "home" });
      else setRec(iso, { type: type, in: "", out: "", overnight: false, lunch: "", lunchNote: "" });
      n++;
    }
    iso = addDays(iso, 1);
  }
  render(); toast(n ? "סומנו " + n + " ימים כ" + TYPES[type].label : "אין ימי עבודה בטווח שנבחר");
}
function doExport(share) {
  var ym = exportYm, blob;
  try { blob = buildXlsx(ym); } catch (e) { toast("יצירת הקובץ נכשלה: " + e.message); return; }
  var name = xlsxName(ym);
  if (share) {
    var file = new File([blob], name, { type: blob.type });
    var data = { files: [file], title: name };
    if (!(navigator.canShare && navigator.canShare(data))) { toast("המכשיר לא מאפשר לשתף קובץ אקסל ישירות. לחצו \"ייצוא לאקסל\" ושלחו את הקובץ שהורד."); return; }
    navigator.share(data).then(function () { S.meta.exported[ym] = new Date().toISOString(); save(); render(); toast("הקובץ שותף"); }, function (e) {
      if (e && e.name === "AbortError") return;
      toast("השיתוף נכשל. לחצו \"ייצוא לאקסל\" ושלחו את הקובץ שהורד.");
    });
    return;
  }
  offerFile(name, blob).then(function (st) {
    if (st === "declined") return;
    S.meta.exported[ym] = new Date().toISOString(); save(); render(); toast("הקובץ " + name + " מוכן");
  }, function () { toast("ההורדה לא זמינה כאן. פתחו את האפליקציה בדפדפן כדי לייצא."); });
}
function doBackup() {
  var data = JSON.stringify({ app: "attendance", v: 1, exportedAt: new Date().toISOString(), days: S.days, settings: S.settings }, null, 1);
  var name = "גיבוי_נוכחות_" + todayIso() + ".json";
  offerFile(name, new Blob([data], { type: "application/json" })).then(function (st) {
    if (st === "declined") return;
    S.meta.lastBackup = new Date().toISOString(); save(); render(); toast("הגיבוי נשמר");
  }, function () { toast("ההורדה לא זמינה כאן. פתחו את האפליקציה בדפדפן כדי לגבות."); });
}
function readBackup(file) {
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var o = JSON.parse(fr.result);
      if (!o || o.app !== "attendance" || typeof o.days !== "object") throw new Error("bad");
      Object.keys(o.days).forEach(function (k) { if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) throw new Error("bad"); });
      pendingRestore = { file: file.name, data: o };
    } catch (e) { pendingRestore = null; toast("הקובץ אינו גיבוי של שעון נוכחות."); }
    render();
    var c = $("#b-confirm"); if (c) c.scrollIntoView({ block: "center", behavior: "smooth" });
  };
  fr.onerror = function () { toast("לא ניתן לקרוא את הקובץ."); };
  fr.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener("click", function (e) {
  var el = e.target.closest("button, [data-view]");
  if (!el) { if (e.target.id === "scrim") requestClose(); return; }
  var id = el.id;
  if (el.hasAttribute("data-view")) { view = el.getAttribute("data-view"); if (view === "month") monthCursor = monthCursor || ymOf(todayIso()); render(); window.scrollTo(0, 0); return; }
  if (el.hasAttribute("data-edit")) { openEdit(el.getAttribute("data-edit")); return; }
  if (el.hasAttribute("data-settype")) { setTodayType(el.getAttribute("data-settype")); return; }
  if (el.hasAttribute("data-goexport")) { exportYm = el.getAttribute("data-goexport"); view = "export"; render(); window.scrollTo(0, 0); return; }
  switch (id) {
    case "punch-in": punch("in"); break;
    case "punch-out": punch("out"); break;
    case "punch-out-prev": punch("out-prev"); break;
    case "lunch-save": saveLunch(); break;
    case "quick-backup": doBackup(); break;
    case "m-prev": case "m-next":
      var d = parseIso(monthCursor + "-01"); d.setMonth(d.getMonth() + (id === "m-prev" ? -1 : 1)); monthCursor = isoOf(d).slice(0, 7); render(); break;
    case "r-apply": applyRange(); break;
    case "x-go": doExport(false); break;
    case "x-share": doExport(true); break;
    case "b-go": doBackup(); break;
    case "b-pick": var fi = $("#b-file"); fi.value = ""; fi.click(); break;
    case "b-confirm":
      if (pendingRestore) { var o = pendingRestore.data; S = normalize({ days: o.days, settings: o.settings, meta: S.meta }); save(); pendingRestore = null; view = "today"; render(); window.scrollTo(0, 0); toast("הנתונים שוחזרו: " + Object.keys(S.days).length + " ימים"); }
      break;
    case "b-cancel": pendingRestore = null; render(); break;
    case "s-save":
      var wd = []; document.querySelectorAll("[data-wd]").forEach(function (c) { if (c.checked) wd.push(+c.getAttribute("data-wd")); });
      var std = Number($("#s-std").value), cap = Number($("#s-cap").value);
      if (isNaN(cap) || cap < 0 || cap > LUNCH_MAX) { toast("תקרה לא תקינה"); break; }
      S.settings = { name: $("#s-name").value.trim(), workDays: wd, stdHours: isNaN(std) ? 9 : std, lunchCap: cap };
      save(); toast("ההגדרות נשמרו"); break;
    case "e-close": requestClose(); break;
    case "e-save": saveEdit(false); break;
    case "e-yes":
      if (editConfirm && editConfirm.act === "discard") { closeEdit(); break; }
      if (editConfirm && editConfirm.act === "clear") { delete S.days[editIso]; save(); closeEdit(); render(); toast("היום נוקה"); break; }
      var keep = readEdit(); editConfirm = null; restoreEdit(keep); saveEdit(true); break;
    case "e-no": var k2 = readEdit(); editConfirm = null; renderSheet(); restoreEdit(k2); break;
    case "e-clear":
      if (!S.days[editIso]) { closeEdit(); break; }
      var k3 = readEdit(); editConfirm = { text: "למחוק את כל הנתונים של היום הזה?", yes: "מחיקה", act: "clear" }; renderSheet(); restoreEdit(k3); break;
  }
});
document.addEventListener("change", function (e) {
  if (e.target.id === "e-type") syncEditFields();
  if (e.target.id === "x-month" && e.target.value) { exportYm = e.target.value; render(); }
  if (e.target.id === "b-file" && e.target.files && e.target.files[0]) readBackup(e.target.files[0]);
});
document.addEventListener("input", function (e) {
  if (e.target.id === "lunch-today") $("#lunch-hint").innerHTML = lunchHint(e.target.value);
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && editIso) requestClose();
  if (e.key === "Enter" && (e.target.id === "lunch-today" || e.target.id === "lunchnote-today")) { e.preventDefault(); saveLunch(); }
});

// Unsaved text in today's lunch fields must survive the periodic refresh.
function todayLunchDirty() {
  var a = $("#lunch-today"), b = $("#lunchnote-today"); if (!a || !b) return false;
  var r = rec(todayIso()) || {};
  return a.value !== String(typeof r.lunch === "number" ? r.lunch : "") || b.value.trim() !== (r.lunchNote || "");
}
function canAutoRefresh() { return view === "today" && !editIso && !todayLunchDirty() && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)); }
setInterval(function () { if (canAutoRefresh()) render(); }, 30000);
document.addEventListener("visibilitychange", function () { if (!document.hidden && canAutoRefresh()) render(); });

if ("serviceWorker" in navigator && location.protocol === "https:" && !inViewer) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
window.__attendance = { buildXlsx: buildXlsx, holidayOf: holidayOf, state: function () { return S; } };
render();
})();
</script>
